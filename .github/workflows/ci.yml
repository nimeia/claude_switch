# Solo-maintainer CI: one Windows job covers the shippable path.
# Product is Windows-only; cross-platform GUI is not in scope yet.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows:
    name: build · test · package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: VERSION ↔ Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          file_ver=$(tr -d '[:space:]' < VERSION)
          cargo_ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$file_ver cargo=$cargo_ver"
          test "$file_ver" = "$cargo_ver"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (Rust)
        run: cargo test --workspace --all-targets

      - name: Build native engine + status line
        run: cargo build -p claude-switch-ffi -p claude-switch-statusline --release

      - name: test (GUI)
        run: dotnet test gui-win/ClaudeSwitch.App.Tests/ClaudeSwitch.App.Tests.csproj -c Release --nologo

      - name: FFI smoke
        run: dotnet run --project gui-win/FfiSmoke -c Release --no-launch-profile

      - name: Publish single-file
        run: >
          dotnet publish gui-win/ClaudeSwitch.App/ClaudeSwitch.App.csproj
          -c Release -p:PublishSingleFileBundle=true -o dist --nologo

      - name: Verify self-contained
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ClaudeSwitch.exe') {
            throw "expected exactly ClaudeSwitch.exe in dist, got: $($files.Name -join ', ')"
          }

      - name: Smoke-run published exe
        shell: pwsh
        env:
          CLAUDE_SWITCH_LAYOUT_DIR: ${{ runner.temp }}/probe
          CLAUDE_SWITCH_LAYOUT_EXIT: "1"
          CLAUDE_SWITCH_PROBE_SETTLE_MS: "800"
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture-home'
          $p = Start-Process -FilePath dist/ClaudeSwitch.exe `
                 -ArgumentList '--skip-onboarding', '--fixture', $fixture `
                 -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'exe did not exit within 120s' }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          $shot = Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout.png'
          if (-not (Test-Path $shot)) { throw 'the app never reached first paint' }
          Write-Host "published exe launched, rendered and exited cleanly"

      - name: Package (exe + zip + SHA256)
        shell: pwsh
        run: ./packaging/pack.ps1 -PublishDir dist -OutDir artifacts

      - name: Smoke-run extracted zip
        shell: pwsh
        env:
          CLAUDE_SWITCH_LAYOUT_DIR: ${{ runner.temp }}/probe-zip
          CLAUDE_SWITCH_LAYOUT_EXIT: "1"
          CLAUDE_SWITCH_PROBE_SETTLE_MS: "800"
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'unzip'
          Expand-Archive (Get-ChildItem artifacts/*.zip)[0].FullName -DestinationPath $out
          Get-ChildItem $out | Format-Table Name, Length
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture-zip'
          $p = Start-Process -FilePath (Join-Path $out 'ClaudeSwitch.exe') `
                 -ArgumentList '--skip-onboarding', '--fixture', $fixture `
                 -WorkingDirectory $out -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'extracted exe did not exit' }
          if ($p.ExitCode -ne 0) { throw "extracted exe exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout.png'))) {
            throw 'the extracted app never reached first paint'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitch-win-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Releasing is "merge a VERSION bump". The gate is the *absence of the tag*,
  # not the diff of this push: a rerun, a squash, a revert and a force push all
  # have to converge on one release per version, and a diff-based check does not.
  gate:
    name: unreleased version?
    needs: windows
    if: >-
      github.event_name == 'push'
      && (github.ref_name == 'master' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released — nothing to cut"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no tag yet — cutting it"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  # Same build, same smoke, same packaging as a tag push — the release workflow
  # is called, not duplicated, so the shippable path has exactly one definition.
  release:
    needs: gate
    if: needs.gate.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
