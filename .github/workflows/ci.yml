# Gates every push: the Rust core on three platforms, and the Windows shell
# (tests plus the single-file publish users actually download).

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  version-sync:
    name: VERSION ↔ Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace version matches VERSION file
        run: |
          set -euo pipefail
          file_ver=$(tr -d '[:space:]' < VERSION)
          cargo_ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$file_ver cargo=$cargo_ver"
          test "$file_ver" = "$cargo_ver"

  core:
    name: core (${{ matrix.os }})
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

  gui-win:
    name: windows shell
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the native engine
        run: cargo build -p claude-switch-ffi --release

      - name: Test
        run: dotnet test gui-win/ClaudeSwitch.App.Tests/ClaudeSwitch.App.Tests.csproj -c Release

      - name: FFI smoke
        run: dotnet run --project gui-win/FfiSmoke -c Release

      # The shippable artifact is built on every push, not only at release time:
      # a publish that only breaks when tagged breaks at the worst moment.
      - name: Publish single-file
        run: >
          dotnet publish gui-win/ClaudeSwitch.App/ClaudeSwitch.App.csproj
          -c Release -p:PublishSingleFileBundle=true -o dist

      - name: Verify the artifact is self-contained
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ClaudeSwitch.exe') {
            throw "expected exactly ClaudeSwitch.exe in dist, got: $($files.Name -join ', ')"
          }

      - name: Smoke-run the published exe
        shell: pwsh
        env:
          # Isolated home: the smoke run must never touch a real Claude login.
          CLAUDE_SWITCH_LAYOUT_DIR: ${{ runner.temp }}/probe
          CLAUDE_SWITCH_LAYOUT_EXIT: "1"
          CLAUDE_SWITCH_PROBE_SETTLE_MS: "800"
        run: |
          # The one-file check proves packaging, not that the bundle runs. This
          # catches the failure that check cannot see: the native engine failing
          # to resolve out of the self-extracted bundle, which would ship a
          # binary that dies on launch for every user.
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture-home'
          $p = Start-Process -FilePath dist/ClaudeSwitch.exe `
                 -ArgumentList '--skip-onboarding', '--fixture', $fixture `
                 -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'exe did not exit within 120s' }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          $shot = Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout.png'
          if (-not (Test-Path $shot)) { throw 'the app never reached first paint' }
          Get-Content (Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout-rects.txt') |
            Select-String '^(list|status|strip)=' 
          Write-Host "published exe launched, rendered and exited cleanly"

      - name: Package (exe + zip)
        shell: pwsh
        # Built on every push, not only at release: a packaging script that is
        # first exercised while cutting a tag fails while cutting a tag.
        run: ./packaging/pack.ps1 -PublishDir dist -OutDir artifacts

      - name: Extract the zip and run what came out
        shell: pwsh
        env:
          CLAUDE_SWITCH_LAYOUT_DIR: ${{ runner.temp }}/probe-zip
          CLAUDE_SWITCH_LAYOUT_EXIT: "1"
          CLAUDE_SWITCH_PROBE_SETTLE_MS: "800"
        run: |
          # The zip is what most people will download, so the tested path has to
          # be the extracted copy, not the exe we happened to publish.
          $out = Join-Path $env:RUNNER_TEMP 'unzip'
          Expand-Archive (Get-ChildItem artifacts/*.zip)[0].FullName -DestinationPath $out
          Get-ChildItem $out | Format-Table Name, Length
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture-zip'
          $p = Start-Process -FilePath (Join-Path $out 'ClaudeSwitch.exe') `
                 -ArgumentList '--skip-onboarding', '--fixture', $fixture `
                 -WorkingDirectory $out -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'extracted exe did not exit' }
          if ($p.ExitCode -ne 0) { throw "extracted exe exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout.png'))) {
            throw 'the extracted app never reached first paint'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitch-win-x64
          path: artifacts/*
