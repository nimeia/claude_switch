# Build shippable artifacts → GitHub Release.
#
# Three ways in, one publishing rule — the run publishes exactly what the
# "Decide what this run publishes" step resolves, and nothing else:
#   push v*                 tag exists already; publish it
#   workflow_call (ci.yml)  master carries a VERSION with no tag; create it
#   workflow_dispatch       a pre-flight; dry_run=true builds without publishing
#
# ci.yml calls this rather than pushing a tag of its own, because a tag pushed
# with GITHUB_TOKEN does not start another workflow — the release would never
# run.

name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to create and publish, e.g. v0.1.1"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but do not create a GitHub Release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: ClaudeSwitch.exe (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide what this run publishes
        shell: bash
        env:
          CALL_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -n "${CALL_TAG:-}" ]; then
            tag="$CALL_TAG"                       # called by ci.yml
          elif [ "$GITHUB_REF_TYPE" != "tag" ]; then
            tag=""                                # dispatched off a branch
          elif [ "${DRY_RUN:-false}" = "true" ]; then
            tag=""                                # pre-flight
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "${tag:-nothing} will be published"

      # Both paths land here: a pushed tag can disagree with VERSION, and a
      # caller could pass anything. The version in the file is the one truth.
      - name: Tag must match VERSION
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          file_ver=$(tr -d '[:space:]' < VERSION)
          echo "tag=${RELEASE_TAG#v} VERSION=$file_ver"
          test "${RELEASE_TAG#v}" = "$file_ver"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build native engine + status line
        run: cargo build -p claude-switch-ffi -p claude-switch-statusline --release

      - name: Publish single-file
        run: >
          dotnet publish gui-win/ClaudeSwitch.App/ClaudeSwitch.App.csproj
          -c Release -p:PublishSingleFileBundle=true -o dist --nologo

      - name: Verify self-contained
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ClaudeSwitch.exe') {
            throw "expected exactly ClaudeSwitch.exe in dist, got: $($files.Name -join ', ')"
          }

      - name: Smoke-run published exe
        shell: pwsh
        env:
          CLAUDE_SWITCH_LAYOUT_DIR: ${{ runner.temp }}/probe
          CLAUDE_SWITCH_LAYOUT_EXIT: "1"
          CLAUDE_SWITCH_PROBE_SETTLE_MS: "800"
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture-home'
          $p = Start-Process -FilePath dist/ClaudeSwitch.exe `
                 -ArgumentList '--skip-onboarding', '--fixture', $fixture `
                 -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'exe did not exit within 120s' }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout.png'))) {
            throw 'the app never reached first paint'
          }

      - name: Package (exe + zip + SHA256)
        shell: pwsh
        run: ./packaging/pack.ps1 -PublishDir dist -OutDir artifacts

      - name: Smoke-run extracted zip
        shell: pwsh
        env:
          CLAUDE_SWITCH_LAYOUT_DIR: ${{ runner.temp }}/probe-zip
          CLAUDE_SWITCH_LAYOUT_EXIT: "1"
          CLAUDE_SWITCH_PROBE_SETTLE_MS: "800"
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'unzip'
          Expand-Archive (Get-ChildItem artifacts/*.zip)[0].FullName -DestinationPath $out
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture-zip'
          $p = Start-Process -FilePath (Join-Path $out 'ClaudeSwitch.exe') `
                 -ArgumentList '--skip-onboarding', '--fixture', $fixture `
                 -WorkingDirectory $out -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'extracted exe did not exit' }
          if ($p.ExitCode -ne 0) { throw "extracted exe exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout.png'))) {
            throw 'the extracted app never reached first paint'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitch-win-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit when it does not exist yet, which is
          # the ci.yml path; on a tag push it is the tag already checked out.
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/ClaudeSwitch-*-win-x64.zip
            artifacts/ClaudeSwitch-*-win-x64.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 安装

            两种都可以，内容一样：

            | 下载 | 适合 |
            |---|---|
            | `ClaudeSwitch-*-win-x64.zip` | **推荐**。解压即用，附使用说明与许可证。浏览器对 zip 的拦截比 exe 少 |
            | `ClaudeSwitch-*-win-x64.exe` | 只要程序本身 |

            无需安装 .NET 或其它依赖，也没有安装程序——放哪都行，删掉就干净。

            **首次运行会看到 Windows SmartScreen 警告**——这个程序没有代码签名证书。
            点「更多信息」→「仍要运行」。介意的话可以先核对校验和：

            ```powershell
            Get-FileHash ClaudeSwitch-*-win-x64.* -Algorithm SHA256
            ```

            与 `SHA256SUMS.txt` 比对，或自行从源码构建（见 README）。

            > 从 zip 解压出来的文件同样带「来自网络」标记，所以压缩包不会绕过 SmartScreen 提示。
