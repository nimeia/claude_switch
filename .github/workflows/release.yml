# Publishes the one file a user downloads.
#
# Triggered by a `v*` tag so a release is always tied to a commit, and runnable
# by hand for a dry run that builds the artifact without publishing anything.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the artifact but do not create a release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: ClaudeSwitch.exe (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          file_ver=$(tr -d '[:space:]' < VERSION)
          echo "tag=$tag VERSION=$file_ver"
          # A release whose binary reports a different version than its tag is
          # unsupportable — fail here rather than ship it.
          test "$tag" = "$file_ver"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the native engine
        run: cargo build -p claude-switch-ffi --release

      - name: Publish the single-file app
        run: >
          dotnet publish gui-win/ClaudeSwitch.App/ClaudeSwitch.App.csproj
          -c Release -p:PublishSingleFileBundle=true -o dist

      - name: Verify the artifact is self-contained
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          $files | Format-Table Name, Length
          # A stray DLL beside the exe means the bundle did not absorb it, and
          # users who download only the exe would hit a missing-dependency crash.
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ClaudeSwitch.exe') {
            throw "expected exactly ClaudeSwitch.exe in dist, got: $($files.Name -join ', ')"
          }

      - name: Smoke-run the published exe
        shell: pwsh
        env:
          CLAUDE_SWITCH_LAYOUT_DIR: ${{ runner.temp }}/probe
          CLAUDE_SWITCH_LAYOUT_EXIT: "1"
          CLAUDE_SWITCH_PROBE_SETTLE_MS: "800"
        run: |
          # Never publish a binary that has not been launched once. The
          # self-contained check proves packaging; this proves it runs.
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture-home'
          $p = Start-Process -FilePath dist/ClaudeSwitch.exe `
                 -ArgumentList '--skip-onboarding', '--fixture', $fixture `
                 -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'exe did not exit within 120s' }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_SWITCH_LAYOUT_DIR 'gui-layout.png'))) {
            throw 'the app never reached first paint'
          }

      - name: Name the artifact after its version
        shell: bash
        run: |
          set -euo pipefail
          ver=$(tr -d '[:space:]' < VERSION)
          cd dist
          # Two downloads in a folder must be tellable apart.
          mv ClaudeSwitch.exe "ClaudeSwitch-$ver-win-x64.exe"
          sha256sum "ClaudeSwitch-$ver-win-x64.exe" | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeSwitch-win-x64
          path: dist/*

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeSwitch-*-win-x64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 安装

            下载下方的 `ClaudeSwitch-*-win-x64.exe`，双击运行。无需安装 .NET 或其它依赖，也没有安装程序——它就是一个可以随便放、随便删的可执行文件。

            **首次运行会看到 Windows SmartScreen 警告**——这个程序没有代码签名证书。
            点「更多信息」→「仍要运行」。介意的话可以先核对校验和：

            ```powershell
            Get-FileHash ClaudeSwitch-*-win-x64.exe -Algorithm SHA256
            ```

            与 `SHA256SUMS.txt` 比对，或自行从源码构建（见 README）。
